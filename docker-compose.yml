# JerseyStats local dev — API + Postgres
services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://jerseystats:jerseystats@postgres:5432/jerseystats?sslmode=disable
      PORT: "8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jerseystats
      POSTGRES_PASSWORD: jerseystats
      POSTGRES_DB: jerseystats
    ports:
      - "5432:5432"
    volumes:
      - jerseystats_pg:/var/lib/postgresql/data
      - ./backend/db/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/db/seed/teams.sql:/docker-entrypoint-initdb.d/02-teams.sql
      - ./backend/db/seed/jersey_editions.sql:/docker-entrypoint-initdb.d/03-jersey_editions.sql

volumes:
  jerseystats_pg:
